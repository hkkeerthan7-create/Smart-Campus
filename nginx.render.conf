server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Send AI analysis requests to the Python AI service
    location = /api/analyze-issue {
        proxy_pass https://smart-campus-ai-kzq4.onrender.com/analyze-issue;
        proxy_ssl_server_name on;
        proxy_set_header Host smart-campus-ai-kzq4.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Send all other API requests to the Node.js backend
    location /api/ {
        proxy_pass https://smart-campus-backend-zsjh.onrender.com/api/;
        proxy_ssl_server_name on;
        proxy_set_header Host smart-campus-backend-zsjh.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ai/ {
        proxy_pass https://smart-campus-ai-kzq4.onrender.com/;
        proxy_ssl_server_name on;
        proxy_set_header Host smart-campus-ai-kzq4.onrender.com;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}